# Managed by RepoFlow: https://github.com/wkzMagician/gh-repoflow
name: RepoFlow release gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as release source
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          test "${HEAD_BRANCH}" = "dev" || (echo "main releases must come from dev" && exit 1)
