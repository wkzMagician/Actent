      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_runtime
  dartloom_settings:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_settings
  dartloom_settings_secure_storage:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_settings_secure_storage
  dartloom_settings_shared_preferences:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_settings_shared_preferences
  dartloom_storage:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_storage
  dartloom_storage_file:
    git:
      url: https://github.com/wkzMagician/dartloom.git
