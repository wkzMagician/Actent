name: actent
description: "Actent: cross-device programmable content router."
publish_to: 'none'

version: 0.0.1

environment:
  sdk: ^3.13.0

# Dartloom packages are sourced from the Dartloom mono-repository. The
# application imports the capability contracts directly and composes concrete
# implementations in lib/app; there is no generated runtime registry.
dependencies:
  # Dartloom contracts (all selected platforms).
  dartloom_autostart:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_autostart
  dartloom_localization:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_localization
  dartloom_logging:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_logging
  dartloom_messaging:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_messaging
  dartloom_messaging_lan:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_messaging_lan
  dartloom_messaging_ntfy:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_messaging_ntfy
  dartloom_pairing:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_pairing
  dartloom_resident:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_resident
  dartloom_settings:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_settings
  dartloom_singleton:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_singleton
  dartloom_storage:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_storage

  # Dartloom adapter packages composing concrete implementations.
  dartloom_autostart_launch_at_startup:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_autostart_launch_at_startup
  dartloom_localization_gen_l10n:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_localization_gen_l10n
  dartloom_logging_logger:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_logging_logger
  dartloom_resident_tray:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_resident_tray
  dartloom_settings_secure_storage:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_settings_secure_storage
  dartloom_settings_shared_preferences:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_settings_shared_preferences
  dartloom_singleton_socket:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_singleton_socket
  dartloom_storage_file:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_storage_file
  dartloom_storage_indexeddb:
    git:
      url: https://github.com/wkzMagician/dartloom.git
      ref: main
      path: packages/dartloom_storage_indexeddb

  flutter:
    sdk: flutter

  path_provider: ^2.1.6
  crypto: ^3.0.7
  cryptography: ^2.9.0
  http: ^1.6.0
  flutter_js: ^0.8.7
  file_selector: ^1.0.3
  qr_flutter: ^4.1.0
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Force every Dartloom contract and adapter to resolve from the same git
